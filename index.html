<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixing.tr - Tam Ekran Görünüm</title>
    <style>
        /* Sayfa boşluklarını sıfırlıyoruz ve kaydırma çubuklarını kaldırıyoruz */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f4f4;
        }

        /* Iframe'i tüm ekranı kaplayacak şekilde ayarlıyoruz */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- fixing.tr sitesini tam ekran çeken iframe -->
    <iframe src="https://fixing.tr" title="Fixing.tr Web Sitesi" allowfullscreen></iframe>

</body>
</html>
